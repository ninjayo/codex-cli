name: Build and publish Codex CLI image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      codex_version:
        description: "Codex CLI version, e.g. latest or 0.128.0"
        required: false
        default: "latest"
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  IMAGE_NAME: codex-cli
  PLAYWRIGHT_VERSION: "1.62.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Codex version
        id: codex
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.codex_version }}
        run: |
          if [ -z "$INPUT_VERSION" ] || [ "$INPUT_VERSION" = "latest" ]; then
            VERSION="$(npm view @openai/codex version)"
          else
            VERSION="$INPUT_VERSION"
          fi

          PUBLISH_CHANNELS=false
          PUBLISH_LATEST=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PUBLISH_CHANNELS=true
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
               [ -z "$INPUT_VERSION" ] ||
               [ "$INPUT_VERSION" = "latest" ]; then
              PUBLISH_LATEST=true
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_channels=$PUBLISH_CHANNELS" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"
          echo "Using Codex version: $VERSION"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }},priority=1100
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ steps.codex.outputs.publish_latest }}
            type=raw,value=codex-${{ steps.codex.outputs.version }},enable=${{ steps.codex.outputs.publish_channels }}
            type=raw,value=codex-${{ steps.codex.outputs.version }}-playwright-${{ env.PLAYWRIGHT_VERSION }},enable=${{ steps.codex.outputs.publish_channels }}
            type=sha,format=long,prefix=sha-,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=Codex CLI development image
            org.opencontainers.image.description=Codex CLI with Node.js, Playwright, Chromium, Go, Rust, Python, and Java
            io.github.ninjayo.codex.version=${{ steps.codex.outputs.version }}
            io.github.ninjayo.playwright.version=${{ env.PLAYWRIGHT_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CODEX_VERSION=${{ steps.codex.outputs.version }}
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
